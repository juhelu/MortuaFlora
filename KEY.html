<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Chaves | Mortua Flora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="section login">
    <h1>Gerar Chaves de Proteção</h1>
    <p>Tudo acontece neste navegador. Use <strong>Uma Vez</strong>.</p>
    <button class="dlg__submit" id="gerar" type="button">Gerar Chaves</button>
    <div id="saida" hidden>
      <h2>1. Chave Pública (vai no CFG.js)</h2>
      <textarea id="pub" rows="5" readonly style="width:100%"></textarea>
      <h2>2. Chave Privada (SECRETA)</h2>
      <p>Salve o arquivo fora do GitHub. Sem ele ninguém lê as respostas.</p>
      <button class="dlg__submit" id="baixar" type="button">Baixar chave privada</button>
    </div>
  </main>
  <script src="CRP.js"></script>
  <script>
    document.getElementById("gerar").addEventListener("click", function () {
      var b = this; b.disabled = true; b.textContent = "Gerando (alguns segundos)…";
      MF.crip.gerarPar().then(function (k) {
        document.getElementById("pub").value = "chavePublica: " + JSON.stringify({ kty: k.pub.kty, n: k.pub.n, e: k.pub.e, alg: "RSA-OAEP-256", ext: true, key_ops: ["encrypt"] }) + ",";
        document.getElementById("saida").hidden = false; b.hidden = true;
        document.getElementById("baixar").onclick = function () {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([JSON.stringify(k.priv)], { type: "application/json" }));
          a.download = "mortuaflora-chave-privada.json"; a.click();
        };
      });
    });
  </script>
</body>
</html>
